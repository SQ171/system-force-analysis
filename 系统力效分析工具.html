<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统力效分析工具</title>
<script src="https://cdn.plot.ly/plotly-3.0.0.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 16px; }

  #dropZone {
    border: 2px dashed #c0c4cc; border-radius: 10px; padding: 30px;
    text-align: center; background: #fff; cursor: pointer;
    transition: all 0.2s; margin-bottom: 12px;
  }
  #dropZone.drag-over { border-color: #409eff; background: #ecf5ff; }
  #dropZone .icon { font-size: 36px; margin-bottom: 8px; }
  #dropZone p { color: #999; font-size: 14px; }
  #dropZone .hint { font-size: 12px; color: #bbb; margin-top: 4px; }

  .actions { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  .actions button {
    padding: 8px 18px; border: 1px solid #dcdfe6; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px; color: #606266;
    transition: all 0.15s;
  }
  .actions button:hover { color: #409eff; border-color: #409eff; }
  .actions button.primary { background: #409eff; color: #fff; border-color: #409eff; }
  .actions button.primary:hover { background: #337ecc; }
  .actions button.danger:hover { color: #f56c6c; border-color: #f56c6c; }
  #fileCount { font-size: 13px; color: #999; margin-left: auto; }

  #controlPanel {
    display: none; background: #fff; border-radius: 8px; padding: 14px 18px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  #controlPanel .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #controlPanel label { font-size: 13px; color: #555; white-space: nowrap; }
  #controlPanel input[type="radio"] { accent-color: #409eff; margin-right: 4px; }
  #controlPanel input[type="range"] { width: 120px; accent-color: #409eff; }
  #controlPanel input[type="number"] {
    width: 64px; padding: 3px 6px; border: 1px solid #dcdfe6; border-radius: 4px;
    font-size: 13px; text-align: center;
  }
  #trendSettings { display: flex; align-items: center; gap: 12px; margin-left: 20px; flex-wrap: wrap; }
  #trendSettings.disabled { opacity: 0.4; pointer-events: none; }
  #modeHint { font-size: 12px; color: #909399; margin-top: 6px; }
  .divider { width: 1px; height: 20px; background: #e0e0e0; }
  .warn-badge { background: #fef0f0; color: #e6a23c; font-size: 12px; padding: 2px 8px; border-radius: 3px; margin-left: 8px; }

  #statsArea { display: none; margin-bottom: 12px; }
  #statsArea table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); font-size: 13px; }
  #statsArea td, #statsArea th { padding: 7px 14px; text-align: right; border-bottom: 1px solid #eee; }
  #statsArea th { background: #fafafa; color: #666; font-weight: 600; text-align: center; }
  #statsArea td:first-child, #statsArea th:first-child { text-align: left; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  #chartArea { display: none; }
  #chart { width: 100%; height: 72vh; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

  #status { font-size: 13px; color: #999; margin-bottom: 8px; min-height: 20px; }
  #status.error { color: #f56c6c; }
  #status.warn { color: #e6a23c; }

  #fileList { font-size: 13px; color: #666; margin-bottom: 12px; display: none; }
  #fileList .group { margin-bottom: 6px; }
  #fileList .group-label { font-weight: 600; color: #333; }
  #fileList .file-item { display: inline-block; background: #e8f4fd; color: #409eff; padding: 2px 8px; border-radius: 3px; margin: 2px 4px 2px 0; font-size: 12px; }
  #fileList .file-skipped { background: #fef0f0; color: #e6a23c; }
</style>
</head>
<body>
<div class="container">

<h1>系统力效分析工具</h1>
<p class="subtitle">拖入 MET-V6 测试台数据文件，自动按日期分组并生成趋势对比图。支持 UTF-8 / GBK 编码，兼容 .csv、.et 等格式。</p>

<div id="dropZone" onclick="document.getElementById('fileInput').click()">
  <div class="icon">&#x1F4C2;</div>
  <p>拖拽文件到此处，或点击选择文件</p>
  <p class="hint">支持同时选择多个文件 · 自动按文件名中的日期分组 · 兼容 GBK 编码 · 自动去重</p>
</div>
<input type="file" id="fileInput" multiple style="display:none">

<div class="actions">
  <button class="primary" onclick="document.getElementById('fileInput').click()">+ 添加文件</button>
  <button onclick="processAll()" id="btnRefresh">刷新图表</button>
  <button class="danger" onclick="clearAll()">清空全部</button>
  <span id="fileCount">未加载文件</span>
</div>

<div id="status"></div>
<div id="fileList"></div>

<div id="controlPanel">
  <div class="row">
    <label>显示模式:</label>
    <label><input type="radio" name="mode" value="raw" onchange="onModeChange()"> 原始数据</label>
    <label><input type="radio" name="mode" value="trend" onchange="onModeChange()" checked> 趋势图</label>
    <span class="divider"></span>
    <div id="trendSettings">
      <label>每桶点数:</label>
      <input type="range" id="bucketSize" min="50" max="2000" value="400" step="10" oninput="onTrendParamChange()">
      <input type="number" id="bucketSizeNum" value="400" min="10" max="5000" onchange="onTrendParamChange()">
      <label>平滑窗口:</label>
      <input type="range" id="smoothWin" min="3" max="51" value="21" step="2" oninput="onTrendParamChange()">
      <input type="number" id="smoothWinNum" value="21" min="3" max="101" step="2" onchange="onTrendParamChange()">
    </div>
  </div>
  <div id="modeHint"></div>
</div>

<div id="statsArea"></div>
<div id="chartArea"><div id="chart"></div></div>

</div>

<script>
// ---- State ----
let allFileData = [];
let lastSeriesData = null;

// ---- Constants ----
const PALETTE = [
  '#1f77b4','#ff7f0e','#d62728','#2ca02c','#9467bd',
  '#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf',
  '#3366cc','#dc3912','#ff9900','#109618','#990099',
];

const RAW_MODE_THRESHOLD = 5000;

// ---- Drop zone ----
const dropZone = document.getElementById('dropZone');
['dragenter','dragover'].forEach(evt => {
  dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
});
['dragleave','drop'].forEach(evt => {
  dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
});
dropZone.addEventListener('drop', e => {
  handleFiles(e.dataTransfer.files);
});

document.getElementById('fileInput').addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

// ---- Encoding handling ----
function decodeText(buffer, encoding) {
  try {
    return new TextDecoder(encoding, { fatal: false }).decode(buffer);
  } catch (_) {
    return null;
  }
}

function hasHeaderGarbled(text) {
  // Scan only the first 30 lines where Chinese metadata lives
  const headerSample = text.split('\n').slice(0, 30).join('\n');
  const replacementCount = (headerSample.match(/�/g) || []).length;
  // Header area is ~30 lines × ~50 chars = ~1500 chars. If >3 replacements, likely garbled.
  return replacementCount > 3;
}

function readFileAutoEncoding(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const buffer = e.target.result;

      // Try UTF-8 first
      let text = decodeText(buffer, 'utf-8');
      if (text !== null && !hasHeaderGarbled(text)) {
        resolve(text); return;
      }

      // UTF-8 looks garbled — try GBK
      const gbkText = decodeText(buffer, 'gbk');
      if (gbkText !== null) {
        resolve(gbkText); return;
      }

      // Fallback: return whatever UTF-8 gave us
      resolve(text || '');
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// ---- File handling ----
async function handleFiles(fileList) {
  if (fileList.length === 0) return;

  // Dedup: skip files already loaded (by name)
  const existingNames = new Set(allFileData.map(f => f.name));
  const newFiles = [];
  const skippedDup = [];
  for (const f of fileList) {
    if (existingNames.has(f.name)) {
      skippedDup.push(f.name);
    } else {
      newFiles.push(f);
    }
  }

  if (skippedDup.length > 0) {
    setStatus(`${skippedDup.length} 个文件已存在，已跳过`, 'warn');
  }
  if (newFiles.length === 0) {
    setStatus('所有文件均已加载过，未添加新文件', 'warn');
    return;
  }

  setStatus(`正在读取 ${newFiles.length} 个文件...`);
  let completed = 0;
  const fileErrors = [];

  for (const file of newFiles) {
    try {
      const text = await readFileAutoEncoding(file);
      const raw = parseCSV(text, file.name);
      if (raw.length === 0) {
        fileErrors.push({ name: file.name, reason: '未能提取到系统力效数据，可能是列名不匹配或文件格式不同' });
        completed++;
        setStatus(`已读取: ${completed}/${newFiles.length} (${fileErrors.length} 个异常)`);
        continue;
      }
      // Also try to extract date from file content as fallback
      const dateFromContent = extractDateFromContent(text);
      const dateFromName = extractDate(file.name);
      // Prefer content date (日志号) over filename date, but only if valid
      const dateInfo = dateFromContent || dateFromName;
      allFileData.push({
        name: file.name,
        dateKey: dateInfo.key,
        dateLabel: dateInfo.label,
        raw: raw,
      });
    } catch (err) {
      console.error(`Failed to read ${file.name}:`, err);
      fileErrors.push({ name: file.name, reason: err.message || '读取失败' });
    }
    completed++;
    setStatus(`已读取: ${completed}/${newFiles.length}${fileErrors.length > 0 ? ` (${fileErrors.length} 个异常)` : ''}`);
  }

  // Show skipped file details
  if (fileErrors.length > 0) {
    const detail = fileErrors.map(e => `${e.name}: ${e.reason}`).join('; ');
    setStatus(`警告: ${fileErrors.length}/${newFiles.length} 个文件未能解析 — ${detail}`, 'warn');
  } else if (allFileData.length === 0) {
    setStatus('未能读取到任何有效数据，请检查文件格式', true);
    return;
  } else {
    const totalPts = allFileData.reduce((s,f) => s + f.raw.length, 0);
    setStatus(`读取完成，共 ${allFileData.length} 个文件 (${totalPts.toLocaleString()} 条数据)`);
  }

  // Update UI immediately — show file list and control panel
  updateFileList();

  // Always show the control panel so user sees mode selection before refresh
  const totalPts = allFileData.reduce((s,f) => s + f.raw.length, 0);
  document.getElementById('controlPanel').style.display = 'block';
  suggestMode(totalPts);

  // Auto-refresh chart if we already had one
  if (lastSeriesData || allFileData.length > 0) {
    // Don't auto-render; let user click "refresh" to confirm settings
  }
}

function parseCSV(text, fileName) {
  const lines = text.split('\n');
  if (lines.length < 13) return [];

  // Find data header row
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 20); i++) {
    if (lines[i].includes('帧数') || lines[i].includes('系統力效') || lines[i].includes('系统力效')) {
      headerRowIdx = i; break;
    }
  }
  if (headerRowIdx < 0) {
    for (const idx of [11, 10, 12]) {
      if (idx < lines.length && lines[idx].includes(',')) { headerRowIdx = idx; break; }
    }
  }
  if (headerRowIdx < 0) return [];

  // Parse headers — trim, filter empty, normalize bullet
  const rawHeaders = lines[headerRowIdx].split(',');
  const headers = rawHeaders.map(h => h.trim().replace(/\?/g, '•')).filter(h => h.length > 0);

  // Find column: exact → fuzzy → position fallback
  let colIdx = headers.findIndex(h => h === '系统力效-g/W');
  if (colIdx < 0) colIdx = headers.findIndex(h => h.includes('系统力效') || h.includes('系統力效'));
  if (colIdx < 0 && headers.length >= 13) colIdx = 12;
  if (colIdx < 0) return [];

  const dataStartRow = headerRowIdx + 1;
  const raw = [];
  for (let i = dataStartRow; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = line.split(',');
    if (cols.length > colIdx) {
      const val = parseFloat(cols[colIdx]);
      if (!isNaN(val)) raw.push(val);
    }
  }
  return raw;
}

// ---- Date extraction (multi-strategy) ----
function extractDateFromContent(text) {
  // Try to find 日志号: YYYYMMDDHHMMSS in the file header
  const m = text.match(/日志号[:\s，,]*(\d{4})(\d{2})(\d{2})\d{6}/);
  if (m) {
    const [, yy, mm, dd] = m;
    return { key: `${yy}${mm}${dd}`, label: `${yy}年${mm}月${dd}日` };
  }
  return null;
}

function extractDate(filename) {
  // Strategy 1: YYYYMMDD (8-digit date from backup timestamps, most reliable)
  let m = filename.match(/(\d{4})(\d{2})(\d{2})\d{6,}/);
  if (m) {
    const [, yy, mm, dd] = m;
    const mi = parseInt(mm, 10), di = parseInt(dd, 10);
    if (mi >= 1 && mi <= 12 && di >= 1 && di <= 31) {
      return { key: `${yy}${mm}${dd}`, label: `${yy}年${mm}月${dd}日` };
    }
  }

  // Strategy 2: YYMMDD_HHMMSS (standard MET-V6 export name)
  m = filename.match(/(\d{2})(\d{2})(\d{2})[_-](\d{2})(\d{2})(\d{2})/);
  if (m) {
    const [, yy, mm, dd] = m;
    return { key: `20${yy}${mm}${dd}`, label: `20${yy}年${mm}月${dd}日` };
  }

  // Strategy 3: standalone 8-digit YYYYMMDD
  m = filename.match(/(\d{4})(\d{2})(\d{2})/);
  if (m) {
    const [, yy, mm, dd] = m;
    const mi = parseInt(mm, 10), di = parseInt(dd, 10);
    if (mi >= 1 && mi <= 12 && di >= 1 && di <= 31) {
      return { key: `${yy}${mm}${dd}`, label: `${yy}年${mm}月${dd}日` };
    }
  }

  // Strategy 4: standalone 6-digit YYMMDD (validate month/day range)
  m = filename.match(/(\d{6})/);
  if (m) {
    const d = m[1];
    const mi = parseInt(d.slice(2, 4), 10), di = parseInt(d.slice(4, 6), 10);
    if (mi >= 1 && mi <= 12 && di >= 1 && di <= 31) {
      return { key: `20${d}`, label: `20${d.slice(0,2)}年${d.slice(2,4)}月${d.slice(4,6)}日` };
    }
  }

  // Strategy 5: fallback
  const stem = filename.replace(/\.[^.]+$/, '').replace(/^.*[\\/]/, '');
  return { key: stem, label: stem };
}

function updateFileList() {
  const groups = new Map();
  for (const f of allFileData) {
    if (!groups.has(f.dateKey)) groups.set(f.dateKey, []);
    groups.get(f.dateKey).push(f.name);
  }
  const div = document.getElementById('fileList');
  div.style.display = 'block';
  let html = '';
  for (const [key, files] of groups) {
    const lbl = allFileData.find(f => f.dateKey === key).dateLabel;
    html += `<div class="group"><span class="group-label">${lbl}</span> `;
    html += files.map(n => `<span class="file-item">${n}</span>`).join(' ');
    html += `</div>`;
  }
  div.innerHTML = html;
  document.getElementById('fileCount').textContent =
    `${allFileData.length} 个文件 · ${allFileData.reduce((s,f)=>s+f.raw.length,0).toLocaleString()} 条数据`;
}

// ---- Mode suggestion ----
function suggestMode(totalPts) {
  const modeHint = document.getElementById('modeHint');
  if (totalPts < RAW_MODE_THRESHOLD) {
    document.querySelector('input[name="mode"][value="raw"]').checked = true;
    modeHint.textContent = `当前数据量较小 (${totalPts.toLocaleString()} 点)，已自动切换为"原始数据"模式直接描点`;
    onModeChange();
  } else {
    document.querySelector('input[name="mode"][value="trend"]').checked = true;
    modeHint.textContent = `当前数据量较大 (${totalPts.toLocaleString()} 点)，建议使用"趋势图"模式查看整体走势`;
    onModeChange();
  }
}

function onModeChange() {
  const isTrend = document.querySelector('input[name="mode"]:checked').value === 'trend';
  document.getElementById('trendSettings').classList.toggle('disabled', !isTrend);
  if (lastSeriesData) renderChart(lastSeriesData);
}

function onTrendParamChange() {
  const bsSlider = document.getElementById('bucketSize');
  const bsNum = document.getElementById('bucketSizeNum');
  const swSlider = document.getElementById('smoothWin');
  const swNum = document.getElementById('smoothWinNum');

  if (document.activeElement === bsSlider) bsNum.value = bsSlider.value;
  else if (document.activeElement === bsNum) bsSlider.value = bsNum.value;
  if (document.activeElement === swSlider) swNum.value = swSlider.value;
  else if (document.activeElement === swNum) swSlider.value = swNum.value;

  if (document.querySelector('input[name="mode"]:checked').value === 'trend' && lastSeriesData) {
    renderChart(lastSeriesData);
  }
}

// ---- Processing ----
function processAll() {
  if (allFileData.length === 0) {
    setStatus('请先添加文件', true); return;
  }

  setStatus('正在处理...');
  document.getElementById('controlPanel').style.display = 'block';

  // Group by date
  const groups = new Map();
  for (const f of allFileData) {
    if (!groups.has(f.dateKey)) groups.set(f.dateKey, { label: f.dateLabel, raw: [] });
    for (const v of f.raw) groups.get(f.dateKey).raw.push(v);
  }

  const groupEntries = [...groups.entries()].sort();
  const seriesData = [];
  const isTrend = document.querySelector('input[name="mode"]:checked').value === 'trend';
  const bucketSize = parseInt(document.getElementById('bucketSizeNum').value) || 400;
  const smoothWin = parseInt(document.getElementById('smoothWinNum').value) || 21;

  for (let gi = 0; gi < groupEntries.length; gi++) {
    const [key, grp] = groupEntries[gi];
    const raw = grp.raw;
    if (raw.length === 0) continue;

    let minV = Infinity, maxV = -Infinity, sumV = 0;
    for (const v of raw) { if (v < minV) minV = v; if (v > maxV) maxV = v; sumV += v; }

    const entry = {
      name: grp.label,
      color: PALETTE[gi % PALETTE.length],
      raw: raw,
      count: raw.length,
      min: minV, max: maxV, mean: sumV / raw.length,
      rawX: null, rawY: null,
      bktX: null, bktY: null, smoothY: null,
    };

    if (!isTrend || raw.length <= bucketSize) {
      if (raw.length > 100000) {
        const step = Math.ceil(raw.length / 80000);
        entry.rawX = []; entry.rawY = [];
        for (let i = 0; i < raw.length; i += step) {
          entry.rawX.push(i + 1);
          entry.rawY.push(raw[i]);
        }
      } else {
        entry.rawX = raw.map((_, i) => i + 1);
        entry.rawY = raw;
      }
    } else {
      const bktX = [], bktY = [];
      for (let i = 0; i < raw.length; i += bucketSize) {
        const end = Math.min(i + bucketSize, raw.length);
        let s = 0;
        for (let j = i; j < end; j++) s += raw[j];
        bktX.push(i + Math.floor((end - i) / 2));
        bktY.push(s / (end - i));
      }

      const smoothY = [];
      const half = Math.floor(smoothWin / 2);
      for (let i = 0; i < bktY.length; i++) {
        const start = Math.max(0, i - half);
        const end = Math.min(bktY.length, i + half + (smoothWin % 2));
        let s = 0;
        for (let j = start; j < end; j++) s += bktY[j];
        smoothY.push(s / (end - start));
      }
      entry.bktX = bktX; entry.bktY = bktY; entry.smoothY = smoothY;
    }

    seriesData.push(entry);
  }

  if (seriesData.length === 0) {
    setStatus('未能提取有效数据', true); return;
  }

  lastSeriesData = seriesData;

  const globalMin = Math.min(...seriesData.map(s => s.min));
  const globalMax = Math.max(...seriesData.map(s => s.max));
  const yPad = Math.max((globalMax - globalMin) * 0.1, 0.05);

  // Stats table
  const statsArea = document.getElementById('statsArea');
  statsArea.style.display = 'block';
  statsArea.innerHTML = `<table>
    <tr><th></th><th>日期</th><th>数据量</th><th>均值 (g/W)</th><th>范围 (g/W)</th></tr>
    ${seriesData.map(s => `<tr>
      <td><span class="swatch" style="background:${s.color}"></span></td>
      <td>${s.name}</td>
      <td>${s.count.toLocaleString()}</td>
      <td>${s.mean.toFixed(3)}</td>
      <td>${s.min.toFixed(2)} ~ ${s.max.toFixed(2)}</td>
    </tr>`).join('')}
  </table>`;

  // Chart
  document.getElementById('chartArea').style.display = 'block';

  const traces = [];
  for (const s of seriesData) {
    if (s.rawX) {
      traces.push({
        x: s.rawX, y: s.rawY,
        type: 'scattergl',
        mode: 'lines',
        line: { color: s.color, width: 1.2 },
        name: s.name,
        hovertemplate: `帧: %{x}<br>${s.name}: %{y:.3f} g/W<extra></extra>`
      });
    } else {
      traces.push({
        x: s.bktX, y: s.bktY,
        type: 'scatter', mode: 'lines',
        line: { color: s.color, width: 0.6 },
        opacity: 0.3, showlegend: false,
        hovertemplate: `帧: %{x}<br>${s.name} 均值: %{y:.3f} g/W<extra></extra>`
      });
      traces.push({
        x: s.bktX, y: s.smoothY,
        type: 'scatter', mode: 'lines',
        line: { color: s.color, width: 2.8 },
        name: s.name,
        hovertemplate: `帧: %{x}<br>${s.name} 趋势: %{y:.3f} g/W<extra></extra>`
      });
    }
  }

  const layout = {
    xaxis: { title: '帧序号', gridcolor: '#eee', showgrid: true, zeroline: false },
    yaxis: { title: '系统力效 (g/W)', gridcolor: '#eee', showgrid: true,
      range: [(globalMin - yPad).toFixed(2), (globalMax + yPad).toFixed(2)] },
    margin: { l: 60, r: 30, t: 20, b: 50 },
    paper_bgcolor: '#fff', plot_bgcolor: '#fff',
    legend: { x: 0.01, y: 0.99, bgcolor: 'rgba(255,255,255,0.85)', bordercolor: '#ddd', borderwidth: 1 },
    hovermode: 'x unified'
  };

  Plotly.newPlot('chart', traces, layout, { responsive: true, displaylogo: false, scrollZoom: true });
  const totalPts = seriesData.reduce((s, x) => s + x.count, 0);
  const modeLabel = traces[0].type === 'scattergl' ? '原始数据' : '趋势图';
  setStatus(`图表已生成 (${modeLabel}, ${seriesData.length} 组, ${totalPts.toLocaleString()} 点)`);
}

function renderChart(seriesData) {
  const isTrend = document.querySelector('input[name="mode"]:checked').value === 'trend';
  const bucketSize = parseInt(document.getElementById('bucketSizeNum').value) || 400;
  const smoothWin = parseInt(document.getElementById('smoothWinNum').value) || 21;

  const processed = seriesData.map(s => {
    const entry = { ...s };
    if (isTrend && s.count > bucketSize) {
      const raw = s.raw;
      const bktX = [], bktY = [];
      for (let i = 0; i < raw.length; i += bucketSize) {
        const end = Math.min(i + bucketSize, raw.length);
        let sum = 0;
        for (let j = i; j < end; j++) sum += raw[j];
        bktX.push(i + Math.floor((end - i) / 2));
        bktY.push(sum / (end - i));
      }
      const smoothY = [];
      const half = Math.floor(smoothWin / 2);
      for (let i = 0; i < bktY.length; i++) {
        const start = Math.max(0, i - half);
        const end = Math.min(bktY.length, i + half + (smoothWin % 2));
        let sum = 0;
        for (let j = start; j < end; j++) sum += bktY[j];
        smoothY.push(sum / (end - start));
      }
      entry.bktX = bktX; entry.bktY = bktY; entry.smoothY = smoothY;
      entry.rawX = null; entry.rawY = null;
    } else {
      const raw = s.raw;
      if (raw.length > 100000) {
        const step = Math.ceil(raw.length / 80000);
        entry.rawX = []; entry.rawY = [];
        for (let i = 0; i < raw.length; i += step) { entry.rawX.push(i + 1); entry.rawY.push(raw[i]); }
      } else {
        entry.rawX = raw.map((_, i) => i + 1);
        entry.rawY = raw;
      }
      entry.bktX = null; entry.bktY = null; entry.smoothY = null;
    }
    return entry;
  });

  const globalMin = Math.min(...processed.map(s => s.min));
  const globalMax = Math.max(...processed.map(s => s.max));
  const yPad = Math.max((globalMax - globalMin) * 0.1, 0.05);

  const traces = [];
  for (const s of processed) {
    if (s.rawX) {
      traces.push({
        x: s.rawX, y: s.rawY,
        type: 'scattergl', mode: 'lines',
        line: { color: s.color, width: 1.2 },
        name: s.name,
        hovertemplate: `帧: %{x}<br>${s.name}: %{y:.3f} g/W<extra></extra>`
      });
    } else {
      traces.push({
        x: s.bktX, y: s.bktY,
        type: 'scatter', mode: 'lines',
        line: { color: s.color, width: 0.6 },
        opacity: 0.3, showlegend: false,
        hovertemplate: `帧: %{x}<br>${s.name} 均值: %{y:.3f} g/W<extra></extra>`
      });
      traces.push({
        x: s.bktX, y: s.smoothY,
        type: 'scatter', mode: 'lines',
        line: { color: s.color, width: 2.8 },
        name: s.name,
        hovertemplate: `帧: %{x}<br>${s.name} 趋势: %{y:.3f} g/W<extra></extra>`
      });
    }
  }

  const layout = {
    xaxis: { title: '帧序号', gridcolor: '#eee', showgrid: true, zeroline: false },
    yaxis: { title: '系统力效 (g/W)', gridcolor: '#eee', showgrid: true,
      range: [(globalMin - yPad).toFixed(2), (globalMax + yPad).toFixed(2)] },
    margin: { l: 60, r: 30, t: 20, b: 50 },
    paper_bgcolor: '#fff', plot_bgcolor: '#fff',
    legend: { x: 0.01, y: 0.99, bgcolor: 'rgba(255,255,255,0.85)', bordercolor: '#ddd', borderwidth: 1 },
    hovermode: 'x unified'
  };

  Plotly.newPlot('chart', traces, layout, { responsive: true, displaylogo: false, scrollZoom: true });
  const totalPts = processed.reduce((s, x) => s + x.count, 0);
  const modeLabel = isTrend ? '趋势图' : '原始数据';
  setStatus(`图表已更新 (${modeLabel}, ${processed.length} 组, ${totalPts.toLocaleString()} 点)`);
}

function clearAll() {
  allFileData = [];
  lastSeriesData = null;
  document.getElementById('fileList').style.display = 'none';
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('statsArea').style.display = 'none';
  document.getElementById('chartArea').style.display = 'none';
  document.getElementById('controlPanel').style.display = 'none';
  document.getElementById('fileCount').textContent = '未加载文件';
  const chartEl = document.getElementById('chart');
  chartEl.innerHTML = '';
  Plotly.purge(chartEl);
  setStatus('已清空');
}

function setStatus(msg, level) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = level === true ? 'error' : level === 'warn' ? 'warn' : '';
}
</script>
